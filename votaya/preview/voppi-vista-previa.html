<title>voppi!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Marca voppi!: lima #e6ff7f, tinta #222128 y rosa #eb5f7d. Inter muy gruesa y apretada como el logotipo, esquinas generosas.
   Móvil: feed a pantalla completa tipo historias. Escritorio: portada editorial con la pregunta del día y rejilla. */
:root {
  --paper: #ffffff; --wash: #f6f6f2; --ink: #222128; --ink2: #3b3a42; --muted: #6f6e77; --rule: #e7e6e1;
  --lime: #e6ff7f; --lime-deep: #d4f05a; --pink: #eb5f7d; --pink-soft: #fde3e9;
  --a: #eb5f7d; --a-soft: #fde3e9; --b: #222128; --b-soft: #ecebef; --ok: #2f7d4f;
  --display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Inter", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--text); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 800; letter-spacing: -.035em; line-height: 1.04; text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.ico { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#viewport { overflow: hidden; width: 100%; }
#shell { container-type: inline-size; container-name: app; width: 100%; background: var(--paper); min-height: 100vh; }
#shell.desk { width: 1280px; transform-origin: 0 0; }
.modebtn { position: fixed; z-index: 60; left: 0; top: 50%; transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; border-radius: 0 10px 10px 0; padding: 12px 6px; font-weight: 800; font-size: 10px; letter-spacing: .04em; color: var(--ink); background: var(--lime); box-shadow: 0 0 0 1px var(--ink); }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--lime); }
.top .in { max-width: 1240px; margin: 0 auto; height: 58px; padding: 0 16px; display: flex; align-items: center; gap: 22px; }
.brand { display: flex; align-items: baseline; font-weight: 900; font-size: 28px; letter-spacing: -.06em; line-height: 1; color: var(--ink); }
.brand .ex { color: var(--pink); letter-spacing: 0; }
.nav { display: none; gap: 4px; font-weight: 700; font-size: 14px; }
.nav button { padding: 7px 14px; border-radius: 999px; color: var(--ink2); }
.nav button[aria-current="page"] { color: var(--lime); background: var(--ink); }
.search { display: none; margin-left: auto; position: relative; width: 260px; }
.search input { width: 100%; border: 0; border-radius: 999px; padding: 9px 12px 9px 36px; font-size: 14px; background: rgb(255 255 255 / .75); outline: none; }
.search input:focus { background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.search .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 18px; color: var(--muted); }
.right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 18px; font-weight: 800; font-size: 14px; letter-spacing: -.01em; }
.btn-ink { background: var(--ink); color: var(--lime); }
.btn-lime { background: var(--lime); color: var(--ink); }
.btn-a { background: var(--pink); color: #fff; }
.btn-line { border: 2px solid var(--ink); background: #fff; }
.btn-wa { background: #1fae54; color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--lime); font-weight: 700; font-size: 14px; }
.pts { font-weight: 800; font-size: 13px; padding: 7px 12px; background: var(--ink); color: var(--lime); border-radius: 999px; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; }
@container app (min-width: 900px) { .nav { display: flex; } .search { display: block; } .right { margin-left: 0; } .m { display: none !important; } }
@container app (max-width: 899px) { .d { display: none !important; } }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 100px; }
@container app (min-width: 900px) { .wrap { padding-bottom: 48px; } }

/* Barra inferior móvil */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar.dark { background: var(--ink); border-top-color: #34333b; color: #fff; }
.tabbar ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; font-size: 10.5px; font-weight: 600; color: #8a8a84; }
.tabbar.dark button { color: #8c8c8c; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar.dark button[aria-current="page"] { color: var(--lime); }
.tabbar .plus { width: 48px; height: 32px; border-radius: 999px; display: grid; place-items: center; background: var(--lime); color: var(--ink); }
@container app (min-width: 900px) { .tabbar { display: none; } }

/* Foto con respaldo tipográfico */
.ph { position: relative; overflow: hidden; display: grid; place-items: center; background: var(--tone, #d9d6cf); color: rgb(255 255 255 / .92); }
.ph .ini { font-weight: 900; font-size: 46px; letter-spacing: -.06em; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* ---------- FEED tipo historias (móvil) ---------- */
.feed { position: fixed; inset: 0 0 56px 0; z-index: 20; background: var(--ink); color: #fff; display: flex; flex-direction: column; }
.feed .bars { display: flex; gap: 3px; padding: 10px 10px 0; }
.feed .bars i { flex: 1; height: 2.5px; border-radius: 2px; background: rgb(255 255 255 / .28); overflow: hidden; }
.feed .bars i.on { background: var(--lime); }
.feed .bars i.cur b { display: block; height: 100%; width: 0; background: var(--lime); }
.feed .bar0 { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 0; }
.feed .tabs2 { display: flex; gap: 16px; font-weight: 700; font-size: 15px; }
.feed .tabs2 button { color: rgb(255 255 255 / .55); }
.feed .tabs2 button[aria-current="page"] { color: var(--lime); }
.feed .meta { padding: 14px 16px 0; display: flex; justify-content: space-between; align-items: baseline; }
.feed .meta .kicker { color: rgb(255 255 255 / .7); }
.feed h1 { padding: 8px 16px 14px; font-size: 32px; color: #fff; }
.feed .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.feed .duo { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr 1fr; gap: 6px; padding: 0 8px 8px; }
.feed .duo > button { position: relative; min-height: 0; overflow: hidden; text-align: left; color: #fff; border-radius: 20px; }
.feed .duo .ph { position: absolute; inset: 0; }
.feed .duo .ph .ini { font-size: 90px; }
.feed .duo .shade { position: absolute; inset: 40% 0 0; background: linear-gradient(transparent, rgb(0 0 0 / .78)); }
.feed .duo .lab { position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.feed .duo .lab b { font-weight: 900; font-size: 32px; line-height: 1; letter-spacing: -.04em; }
.feed .duo .tag { font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px; }
.feed .duo .side-a .tag { background: var(--pink); color: #fff; }
.feed .duo .side-b .tag { background: var(--lime); color: var(--ink); }
.feed .duo .tint { position: absolute; inset: 0; opacity: 0; transition: opacity .35s; }
.feed .duo .pct { position: absolute; right: 16px; top: 12px; font-weight: 900; font-size: 46px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; opacity: 0; transform: translateY(6px); transition: all .35s; }
.feed .duo.voted .pct { opacity: 1; transform: none; }
.feed .duo.voted .tint { opacity: .45; }
.feed .duo.voted button { cursor: default; }
.feed .duo .mine .lab b::after { content: " ✓"; }
.feed .vsline { position: absolute; left: 0; right: 0; top: 50%; height: 0; display: flex; justify-content: center; pointer-events: none; z-index: 2; }
.feed .vsline span { transform: translateY(-50%); background: var(--lime); color: var(--ink); font-weight: 900; font-size: 14px; padding: 9px 12px; border-radius: 999px; border: 3px solid var(--ink); }
.feed .multi { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 14px 14px; gap: 8px; }
.feed .multi .bg { position: absolute; inset: 0; }
.feed .multi.voted { padding-bottom: 158px; justify-content: safe flex-end; overflow-y: auto; }
.feed .multi > :not(.bg) { flex: none; }
.feed .multi .bg .ph { position: absolute; inset: 0; }
.feed .multi .bg .ph .ini { font-size: 140px; opacity: .35; }
.feed .multi .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgb(0 0 0 / .15), rgb(0 0 0 / .78) 55%); }
.feed .opt { position: relative; z-index: 1; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; border-radius: 999px; padding: 14px 18px; background: #fff; color: var(--ink); font-weight: 800; font-size: 16px; }
.feed .opt .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--lime); transition: width .7s cubic-bezier(.2,.8,.2,1); }
.feed .opt.mine .fill { background: var(--pink); }
.feed .opt.mine { color: var(--ink); }
.feed .opt > span { position: relative; }
.feed .opt .p { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s; }
.feed .multi.voted .opt .p { opacity: 1; }
.feed .opt.other { background: rgb(255 255 255 / .16); color: #fff; border: 1px dashed rgb(255 255 255 / .6); }
.feed .otherin { position: relative; z-index: 1; display: flex; gap: 6px; background: #fff; border-radius: 999px; padding: 5px; }
.feed .otherin input { flex: 1; min-width: 0; border: 0; outline: none; padding: 8px 10px; font-weight: 600; font-size: 16px; color: var(--ink); }
.feed .after { position: absolute; z-index: 3; left: 12px; right: 12px; bottom: 14px; display: grid; gap: 10px; background: rgb(34 33 40 / .9); backdrop-filter: blur(6px); border-radius: 22px; padding: 14px; }
.feed .after .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.feed .after .timer { height: 3px; background: rgb(255 255 255 / .2); border-radius: 3px; overflow: hidden; }
.feed .after .timer b { display: block; height: 100%; width: 0; background: var(--lime); }
.feed .after .acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.feed .after .acts .btn { padding: 9px 6px; font-size: 13px; }
.feed .done { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
.toastpts { position: absolute; z-index: 4; right: 14px; top: 10px; font-weight: 900; font-size: 14px; background: var(--lime); color: var(--ink); padding: 6px 11px; border-radius: 999px; animation: up 1.8s ease-out forwards; }
@keyframes up { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
@keyframes grow { to { width: 100%; } }

/* ---------- Escritorio / Explorar ---------- */
.lead { display: grid; gap: 28px; }
@container app (min-width: 900px) { .lead { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } }
.lead > * { min-width: 0; }
.daily { background: var(--lime); border-radius: 28px; padding: 26px; }
.daily h1 { font-size: clamp(40px, 6vw, 68px); margin: 8px 0 18px; letter-spacing: -.05em; }
.daily .kicker { color: var(--ink); }
.duelbig { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.duelbig > button { position: relative; aspect-ratio: 4 / 3; overflow: hidden; color: #fff; text-align: left; max-width: 100%; border-radius: 24px; }
.duelbig .ph { position: absolute; inset: 0; }
.duelbig .ph .ini { font-size: 110px; }
.duelbig .shade { position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgb(0 0 0 / .72)); }
.duelbig .lab { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; }
.duelbig .lab b { font-weight: 900; font-size: 38px; line-height: 1; letter-spacing: -.04em; }
.duelbig .lab span { font-weight: 800; font-size: 14px; padding: 9px 15px; border-radius: 999px; }
.duelbig .side-a .lab span { background: var(--a); }
.duelbig .side-b .lab span { background: var(--lime); color: var(--ink); }
.duelbig .vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--ink); color: var(--lime); font-weight: 900; font-size: 15px; padding: 12px 13px; border-radius: 999px; z-index: 2; border: 4px solid #fff; }
@container app (max-width: 599px) { .duelbig > button { aspect-ratio: 3 / 4; } .duelbig .lab { left: 10px; right: 10px; bottom: 10px; flex-direction: column; align-items: flex-start; gap: 6px; } .duelbig .lab b { font-size: 24px; } .duelbig .ph .ini { font-size: 64px; } }
.split { margin-top: 12px; }
.split .track { display: flex; height: 12px; border-radius: 999px; overflow: hidden; }
.split .track i { background: var(--a); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.split .track em { flex: 1; background: var(--b); }
.split .nums { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 800; font-size: 15px; }
.split .nums .a { color: var(--a); } .split .nums .b { color: var(--b); }

.sec { margin-top: 44px; }
.sechead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sechead h2 { font-size: 30px; letter-spacing: -.045em; }
.texttabs { display: flex; gap: 16px; font-weight: 600; font-size: 14px; flex-wrap: wrap; }
.texttabs button { color: var(--muted); padding: 7px 14px; border-radius: 999px; background: var(--wash); }
.texttabs button[aria-pressed="true"], .texttabs button[aria-selected="true"] { color: var(--lime); background: var(--ink); }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 18px; padding: 0 16px; }
.cats button { flex: none; display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13.5px; background: var(--wash); }
.cats button i { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); }
.cats button[aria-pressed="true"] { background: var(--lime); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }

.grid { display: grid; gap: 28px 22px; grid-template-columns: 1fr; }
@container app (min-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container app (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { display: grid; gap: 9px; align-content: start; text-align: left; }
.card .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.card .pics .ph { border-radius: 18px; }
.card .pics .ph { aspect-ratio: 1 / 1; max-width: 100%; }
.card .pics.one { grid-template-columns: 1fr; }
.card .pics.one .ph { aspect-ratio: 2 / 1; }
.card h3 { font-size: 22px; letter-spacing: -.04em; }
.card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.card .row .vote { font-weight: 800; background: var(--lime); color: var(--ink); border-radius: 999px; padding: 5px 12px; }
.minisplit { display: flex; height: 8px; border-radius: 999px; overflow: hidden; }
.minisplit i { background: var(--a); } .minisplit em { flex: 1; background: var(--b); }
.minilegend { display: flex; justify-content: space-between; font-weight: 600; font-size: 12.5px; color: var(--ink2); }
.voted-tag { font-weight: 800; font-size: 12px; color: var(--ok); }

.side { display: grid; gap: 30px; align-content: start; }
.side h2 { font-size: 22px; margin-bottom: 8px; letter-spacing: -.04em; }
.side > section { background: var(--wash); border-radius: 22px; padding: 18px; }
.olist { list-style: none; margin: 0; padding: 0; }
.olist li { border-bottom: 1px solid var(--rule); }
.olist button { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 11px 0; text-align: left; }
.olist .n { font-weight: 900; font-size: 15px; color: var(--pink); }
.olist b { font-weight: 600; line-height: 1.25; }
.olist .v { font-weight: 600; font-size: 12px; color: var(--muted); }
.countries li { display: grid; grid-template-columns: 28px 26px 1fr auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.countries .n { font-weight: 900; font-size: 14px; color: var(--pink); }
.countries .v { font-weight: 700; font-size: 13px; }

/* Tiles de categorías (Explorar) */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
@container app (min-width: 700px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tiles button { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 20px; overflow: hidden; color: #fff; text-align: left; }
.tiles .ph { position: absolute; inset: 0; }
.tiles .ph .ini { display: none; }
.tiles button::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgb(0 0 0 / .7)); }
.tiles b { position: absolute; z-index: 1; left: 14px; bottom: 12px; font-weight: 900; font-size: 22px; letter-spacing: -.04em; }
.tiles small { position: absolute; z-index: 1; left: 12px; top: 12px; font-weight: 800; font-size: 11px; background: var(--lime); color: var(--ink); padding: 4px 9px; border-radius: 999px; }
.hscroll { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; scroll-snap-type: x mandatory; }
.hscroll > button { flex: none; width: 160px; scroll-snap-align: start; text-align: left; display: grid; gap: 8px; }
.hscroll .ph { aspect-ratio: 4 / 5; border-radius: 20px; max-width: 100%; }
.hscroll b { font-weight: 800; font-size: 17px; line-height: 1.15; letter-spacing: -.03em; }
.listrow { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); text-align: left; width: 100%; }
.listrow .ph { width: 76px; height: 76px; border-radius: 18px; }
.listrow .ph .ini { font-size: 26px; }
.listrow b { font-weight: 800; font-size: 18px; line-height: 1.15; letter-spacing: -.03em; display: block; margin: 3px 0 6px; }

/* Página de encuesta */
.pollpage { max-width: 760px; margin: 0 auto; }
.pollpage h1 { font-size: clamp(34px, 7vw, 56px); margin: 10px 0 20px; letter-spacing: -.05em; }
.optlist { display: grid; gap: 8px; }
.optrow { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid var(--rule); border-radius: 22px; padding: 8px 16px 8px 8px; font-weight: 800; font-size: 16px; background: #fff; }
.optrow:hover { border-color: var(--ink); }
.optrow .ph { width: 52px; height: 52px; border-radius: 15px; flex: none; }
.optrow .ph .ini { font-size: 20px; }
.optrow .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--lime); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.optrow.mine { border-color: var(--ink); }
.optrow.mine .fill { background: var(--pink); }
.optrow > :not(.fill) { position: relative; }
.optrow .lbl { flex: 1; }
.optrow .p { font-weight: 900; font-size: 16px; font-variant-numeric: tabular-nums; }
.optrow.other { border-style: dashed; color: var(--muted); font-weight: 600; }
.otherrow { display: flex; gap: 8px; border: 2px solid var(--ink); border-radius: 999px; padding: 5px; }
.otherrow input { flex: 1; min-width: 0; border: 0; outline: none; padding: 8px 10px; font-size: 16px; font-weight: 600; }
.wis { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.wis span { font-size: 13px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; }
.wis span.mine { border-color: var(--a); color: var(--a); }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--rule); padding: 2px 0 2px 10px; }
.callout { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--lime); border-radius: 22px; padding: 16px 18px; font-weight: 600; }
.segs { display: grid; gap: 12px; }
.seg .h { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.seg .t { display: flex; height: 10px; border-radius: 999px; overflow: hidden; }

/* Rankings */
.ranktable { width: 100%; border-collapse: collapse; }
.ranktable td { padding: 12px 6px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.ranktable .n { font-weight: 900; font-size: 20px; width: 44px; color: var(--pink); }
.ranktable .t b { font-weight: 800; font-size: 18px; line-height: 1.15; letter-spacing: -.03em; display: block; }
.ranktable .v { text-align: right; font-weight: 800; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ranktable .ph { width: 56px; height: 56px; border-radius: 15px; }
.ranktable .ph .ini { font-size: 22px; }

/* Perfil y formularios */

      ${r.rows.filter((x) => x.i !== "other" || voted).map((x) => { const mine = v && (v.i === null ? x.i === "other" : x.i === v.i); return `<button class="opt ${mine ? "mine" : ""}" ${voted ? "disabled" : `data-fvote="${x.i}"`}><span class="fill" data-w="${voted ? x.pct : 0}"></span><span>${esc(x.label)}${mine ? " ✓" : ""}</span><span class="p">${x.pct}%</span></button>`; }).join("")}
      ${!voted && p.other ? `<div id="otherslot"><button class="opt other" data-fother="1"><span>Otra respuesta… escribe la tuya</span><span>＋</span></button></div>` : ""}
      ${voted && v.i === null ? `<p class="mono" style="position:relative;z-index:1;margin:0;font-size:12px;opacity:.85">Tu respuesta «${esc(myLabel(p))}» se ha sumado a las de la comunidad</p>` : ""}</div>`;
  }
  const after = voted ? `<div class="after" role="status"><div class="row"><span><b>Tu voto:</b> ${esc(myLabel(p))}</span>${earnedNow ? `<span class="mono">+${earnedNow} pts</span>` : ""}</div><div class="timer"><b id="tbar"></b></div><div class="acts"><a class="btn btn-wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${encodeURIComponent(`Yo voté «${myLabel(p)}» en «${p.title}» ¿Y tú? voppi.app`)}">Retar</a><button class="btn" style="border:1px solid rgb(255 255 255 / .6)" data-detail="${p.id}">Detalle</button><button class="btn" style="background:#fff;color:#000" data-fnext="1">Siguiente</button></div></div>` : "";
  root.innerHTML = `${head}<div class="stage">${stage}${after}${earnedNow ? `<span class="toastpts">+${earnedNow}</span>` : ""}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll("[data-w]").forEach((el) => (el.style.width = el.dataset.w + "%"));
    const cur = root.querySelector(".bars .cur b"); if (cur && voted) cur.style.cssText = `animation:grow ${AUTO_MS}ms linear forwards`;
    const tb = $("#tbar"); if (tb) tb.style.cssText = `animation:grow ${AUTO_MS}ms linear forwards`;
  }));
  if (voted) { clearTimer(); feedTimer = setTimeout(nextStory, AUTO_MS); }
}

/* ---------------- Piezas de escritorio / explorar ---------------- */
function catChips(active, attr = "data-cat") {
  return `<div class="cats">${[["", "Todas", "#222128"], ...Object.entries(CATS).map(([k, c]) => [k, c[0], c[1]])].map(([k, n, t]) => `<button ${attr}="${k}" aria-pressed="${(active || "") === k}" style="--tone:${t}">${k ? "<i></i>" : ""}${n}</button>`).join("")}</div>`;
}
function card(p) {
  const r = results(p), two = p.options.length === 2 && !p.other, v = votes[p.id];
  const pics = two ? `<span class="pics">${p.options.map((o) => photo(o.img || p.cover, o.l, p.cat)).join("")}</span>` : `<span class="pics one">${photo(p.cover, p.title, p.cat)}</span>`;
  const top2 = [...r.rows].sort((a, b) => b.count - a.count).slice(0, 2);
  const a = two ? r.rows[0] : top2[0], b = two ? r.rows[1] : top2[1];
  return `<button class="card" data-poll="${p.id}">${pics}
    <span class="row"><span class="kicker" style="color:${CATS[p.cat][1]}">${CATS[p.cat][0]}</span><span class="kicker">${p.ago}</span></span>
    <h3>${esc(p.title)}</h3>
    <span class="minisplit"><i style="width:${(a.pct / (a.pct + b.pct)) * 100}%"></i><em></em></span>
    <span class="minilegend"><span>${esc(a.label)} ${a.pct}%</span><span>${b.pct}% ${esc(b.label)}</span></span>
    <span class="row"><span class="mono muted">${fmt(r.total)} votos${two ? "" : ` · ${p.options.length} opciones`}</span>${v ? `<span class="voted-tag">Votada ✓</span>` : `<span class="vote">Votar →</span>`}</span></button>`;
}
function trendingList(n = 6) { return [...POLLS].sort((a, b) => b.votes - a.votes).slice(0, n); }
function sideBlocks() {
  return `<aside class="side"><section><h2>Tendencias</h2><ol class="olist">${trendingList().map((p, i) => `<li><button data-poll="${p.id}"><span class="n">${String(i + 1).padStart(2, "0")}</span><b>${esc(p.title)}</b><span class="v">${fmt(p.votes)}</span></button></li>`).join("")}</ol></section>
    <section><h2>Países que más votan</h2><ol class="olist countries">${COUNTRIES.slice(0, 6).map(([f, n, v], i) => `<li><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${f}</span><span>${n}</span><span class="v">${fmt(v)}</span></li>`).join("")}</ol></section>
    ${user ? `<section><h2>Tu actividad</h2><p style="margin:0" class="mono">${voteCount()} votos · ${balance()} pts · racha ${streak()} d</p><p class="muted" style="margin:4px 0 0;font-size:14px">Nivel ${level().name}${level().next ? ` · ${level().next[0] - voteCount()} votos para ${level().next[1]}` : ""}</p></section>` : `<section><h2>Únete</h2><p style="margin:0 0 12px" class="muted">Guarda tus votos, suma puntos y mira qué opina tu país.</p><button class="btn btn-ink" data-go="login">Crear cuenta gratis</button></section>`}</aside>`;
}

function duelBig(p) {
  const r = results(p), v = votes[p.id];
  return `<div class="duelbig">${p.options.map((o, i) => `<button class="side-${i ? "b" : "a"}" ${v ? "" : `data-vote="${p.id}" data-i="${i}"`} aria-label="Votar ${esc(o.l)}">${photo(o.img || p.cover, o.l, p.cat)}<span class="shade"></span><span class="lab"><b>${esc(o.l)}${v && v.i === i ? " ✓" : ""}</b>${v ? `<span>${r.rows[i].pct}%</span>` : `<span>Votar</span>`}</span></button>`).join("")}<span class="vs">VS</span></div>
    ${v ? `<div class="split"><div class="track"><i data-w="${r.rows[0].pct}" style="width:50%"></i><em></em></div><div class="nums"><span class="a">${esc(r.rows[0].label)} ${r.rows[0].pct}%</span><span class="b">${r.rows[1].pct}% ${esc(r.rows[1].label)}</span></div></div>` : ""}`;
}

function optionList(p) {
  const r = results(p), v = votes[p.id];
  const rows = r.rows.filter((x) => x.i !== "other" || v).map((x) => { const mine = v && (v.i === null ? x.i === "other" : x.i === v.i); const o = p.options[x.i]; return `<button class="optrow ${mine ? "mine" : ""}" ${v ? "" : `data-vote="${p.id}" data-i="${x.i}"`}><span class="fill" data-w="${v ? x.pct : 0}"></span>${o ? photo(o.img, o.l, p.cat) : `<span class="ph" style="--tone:#bbb"><span class="ini">+</span></span>`}<span class="lbl">${esc(x.label)}${mine ? " ✓" : ""}</span>${v ? `<span class="p">${x.pct}%</span>` : ""}</button>`; }).join("");
  const other = !v && p.other ? `<div id="otherslot"><button class="optrow other" data-pother="${p.id}"><span class="ph" style="--tone:#e3e3de;color:#6e6e68"><span class="ini">+</span></span><span class="lbl">Otra respuesta… escribe la tuya</span></button></div>` : "";
  const wis = v && r.wis.length ? `<div class="wis">${r.wis.slice(0, 10).map((w) => `<span class="${v.i === null && same(w.l, v.other) ? "mine" : ""}">${esc(w.l)} · <span class="mono">${w.n}</span></span>`).join("")}</div>` : "";
  return `<div class="optlist">${rows}${other}</div>${wis}`;
}

/* ---------------- Páginas ---------------- */
const pages = {
  feed() { return `<div class="feed" id="feedroot"></div>`; },
  home() {
    if (isMobile()) { view.name = "feed"; return pages.feed(); }
    const f = POLLS.find((p) => p.featured), v = votes[f.id];
    const cat = view.cat || "";
    const list = POLLS.filter((p) => p !== f && (!cat || p.cat === cat)).sort((a, b) => b.votes - a.votes).slice(0, 9);
    return `<div class="lead"><div class="daily"><span class="kicker">Pregunta del día · ${CATS[f.cat][0]}</span><h1>${esc(f.title)}</h1>${duelBig(f)}
      <p class="muted" style="margin:12px 0 0;font-size:14px">${v ? `Has votado <b style="color:var(--ink)">${esc(myLabel(f))}</b>. ` : "Toca una foto para votar. "}<button style="text-decoration:underline" data-go="feed">Seguir en modo historias →</button></p></div>${sideBlocks()}</div>
      <section class="sec"><div class="sechead"><h2>Encuestas populares</h2><button class="kicker" style="color:var(--ink)" data-go="explore">Ver todas →</button></div>${catChips(cat, "data-homecat")}<div class="grid">${list.map(card).join("") || '<p class="muted">No hay encuestas en esta categoría.</p>'}</div></section>`;
  },
  explore() {
    const q = view.q || "", cat = view.cat || "";
    const sort = view.sort || "top";
    const ageDays = (p) => { const m = /(\d+)\s*(h|d|sem)/.exec(p.ago || ""); return m ? Number(m[1]) * (m[2] === "h" ? 1 / 24 : m[2] === "sem" ? 7 : 1) : 30; };
    const filtered = POLLS.filter((p) => (!cat || p.cat === cat) && (!q || norm(p.title + p.options.map((o) => o.l).join(" ")).includes(norm(q))))
      .sort((a, b) => sort === "new" ? ageDays(a) - ageDays(b) : sort === "trend" ? b.votes / (1 + ageDays(b)) - a.votes / (1 + ageDays(a)) : b.votes - a.votes);
    const counts = Object.fromEntries(Object.keys(CATS).map((k) => [k, POLLS.filter((p) => p.cat === k).length]));
    const tileImg = { comida: "pizza", deportes: "stadium", entretenimiento: "cinema", "estilo-de-vida": "beach", tecnologia: "phoneA", marcas: "colaRed", paises: "city", productos: "social", politica: "ballot" };
    return `${cat ? `<button class="kicker" data-cat="">← Explorar</button>` : ""}<h1 style="font-size:clamp(40px,8cqi,56px);margin:2px 0 14px;${cat ? `color:${CATS[cat][1]}` : ""}">${cat ? CATS[cat][0] : "Explorar"}</h1>
      <div class="searchpill"><input id="xq" value="${esc(q)}" placeholder="Busca: Messi, pizza, series, países…" aria-label="Buscar encuestas"><button class="btn btn-ink" data-go="explore" tabindex="-1">Buscar</button></div>
      ${!q && !cat ? `<section style="margin-bottom:30px"><div class="sechead"><h2>Tendencias hoy</h2><button class="kicker" style="color:var(--ink)" data-go="feed">Modo historias →</button></div><div class="hscroll">${trendingList(8).map((p) => `<button data-poll="${p.id}">${photo(coverOf(p), p.title, p.cat)}<span class="kicker" style="color:${CATS[p.cat][1]}">${CATS[p.cat][0]}</span><b>${esc(p.title)}</b><span class="mono muted" style="font-size:12px">${fmt(p.votes)} votos</span></button>`).join("")}</div></section>
      <section style="margin-bottom:30px"><div class="sechead"><h2>Categorías</h2></div><div class="tiles">${Object.entries(CATS).map(([k, c]) => `<button data-cat="${k}">${photo(tileImg[k], c[0], k)}<b>${c[0]}</b><small>${counts[k]} encuestas</small></button>`).join("")}</div></section>` : ""}
      <section><div class="sechead"><h2>${cat ? "Encuestas" : q ? `Resultados para «${esc(q)}»` : "Todas las encuestas"}</h2><span class="kicker">${filtered.length} encuestas</span></div>${catChips(cat)}<div class="texttabs" role="tablist" style="margin:4px 0 16px">${[["top", "Más votadas"], ["new", "Nuevas"], ["trend", "En tendencia"]].map(([k, l]) => `<button role="tab" aria-selected="${k === sort}" data-sort="${k}">${l}</button>`).join("")}</div>
      <div class="m">${filtered.map((p) => `<button class="listrow" data-poll="${p.id}">${photo(coverOf(p), p.title, p.cat)}<span><span class="kicker" style="color:${CATS[p.cat][1]}">${CATS[p.cat][0]} · ${fmt(results(p).total)} votos</span><b>${esc(p.title)}</b>${votes[p.id] ? `<span class="voted-tag">Votada ✓</span>` : `<span style="font-weight:700;color:var(--a);font-size:13px">Votar →</span>`}</span></button>`).join("")}</div>
      <div class="grid d">${filtered.map(card).join("")}</div></section>`;
  },
  poll() {
    const p = byId(view.id), v = votes[p.id], r = results(p), two = p.options.length === 2 && !p.other;
    return `<article class="pollpage"><button class="kicker" data-go="${isMobile() ? "explore" : "home"}">← Volver</button>
      <div style="margin-top:14px"><span class="kicker" style="color:${CATS[p.cat][1]}">${CATS[p.cat][0]}</span> <span class="kicker">· ${fmt(r.total)} votos · ${p.ago}</span></div>
      <h1>${esc(p.title)}</h1>
      ${two ? duelBig(p) : optionList(p)}
      ${v ? `<div style="display:grid;gap:10px;margin-top:22px"><a class="btn btn-wa" style="padding:14px" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${encodeURIComponent(`Yo voté «${myLabel(p)}» en «${p.title}» ¿Y tú? voppi.app`)}">Reta a un amigo por WhatsApp</a><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn btn-line" data-net="1">Imagen para Stories</button><button class="btn btn-line" data-net="2">Copiar enlace</button></div></div>
        <section class="sec"><div class="sechead"><h2>¿Qué opina cada grupo?</h2></div>${segments(p)}</section>` : `<p class="note" style="margin-top:16px">Vota para ver los resultados. Votación popular: no es un estudio representativo.</p>`}
      <section class="sec"><div class="sechead"><h2>Siguiente</h2><button class="kicker" style="color:var(--ink)" data-go="feed">Modo historias →</button></div><div class="grid">${POLLS.filter((x) => x.id !== p.id && !votes[x.id]).slice(0, 3).map(card).join("")}</div></section></article>`;
  },
  rankings() {
    const t = view.t || "siempre", cat = view.cat || "";
    const val = t === "siempre" ? (p) => p.votes : t === "semana" ? (p) => Math.round(p.votes * 0.31 + (p.votes % 97)) : (p) => Math.round(p.votes * 0.06 + (p.votes % 41));
    const list = POLLS.filter((p) => !cat || p.cat === cat).sort((a, b) => val(b) - val(a)).slice(0, 15);
    return `<div class="lead"><section><div class="sechead" style="border:0;padding:0"><h1 style="font-size:48px">Rankings</h1></div>
      <div class="texttabs" role="tablist" style="margin:14px 0 16px">${[["siempre", "Histórico"], ["semana", "Esta semana"], ["hoy", "Hoy"]].map(([k, l]) => `<button role="tab" aria-selected="${k === t}" data-rank="${k}">${l}</button>`).join("")}</div>
      ${catChips(cat, "data-rankcat")}
      <table class="ranktable"><tbody>${list.map((p, i) => `<tr data-poll="${p.id}" style="cursor:pointer"><td class="n">${String(i + 1).padStart(2, "0")}</td><td style="width:66px">${photo(coverOf(p), p.title, p.cat)}</td><td class="t"><span class="kicker" style="color:${CATS[p.cat][1]}">${CATS[p.cat][0]}</span><b>${esc(p.title)}</b></td><td class="v">${fmt(val(p))}</td></tr>`).join("")}</tbody></table></section>
      <aside class="side"><section><h2>Países que más votan</h2><ol class="olist countries">${COUNTRIES.map(([f, n, v], i) => `<li><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${f}</span><span>${n}</span><span class="v">${fmt(v)}</span></li>`).join("")}</ol></section></aside></div>`;
  },
  profile() {
    if (!user) return pages.login();
    const lv = level(), hist = Object.entries(votes).sort((a, b) => b[1].at - a[1].at);
    return `<div style="max-width:760px;margin:0 auto"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px"><span class="avatar" style="width:54px;height:54px;font-size:20px">${esc(user.email[0].toUpperCase())}</span><div style="flex:1;min-width:0"><h1 style="font-size:32px;overflow-wrap:anywhere">${esc(user.email.split("@")[0])}</h1><span class="kicker">${esc(user.country)} · ${esc(user.age)} · ${esc(user.gender)}</span></div><button class="btn btn-line" id="logout">Salir</button></div>
      <div class="stats"><div><b>${voteCount()}</b><span class="kicker">Encuestas votadas</span></div><div><b>${balance()}</b><span class="kicker">Puntos</span></div><div><b>${streak()}</b><span class="kicker">Días de racha</span></div><div><b style="font-family:var(--display);font-stretch:72%;font-weight:800">${lv.name}</b><span class="kicker">Nivel</span></div></div>
      ${lv.next ? `<div style="margin-top:14px"><div class="levelbar"><i style="width:${lv.progress}%"></i></div><p class="muted" style="font-size:13px;margin:6px 0 0">${lv.next[0] - voteCount()} votos para ${lv.next[1]}</p></div>` : ""}
      ${proposals.length ? `<section class="sec"><div class="sechead"><h2>Mis preguntas</h2></div>${proposals.map((t) => `<p style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding:10px 0;margin:0"><span>${esc(t)}</span><span class="kicker">En moderación</span></p>`).join("")}</section>` : ""}
      <section class="sec"><div class="sechead"><h2>Historial</h2></div>${hist.length ? hist.map(([id]) => { const p = byId(id); return `<button class="listrow" data-poll="${id}">${photo(coverOf(p), p.title, p.cat)}<span><span class="kicker">${CATS[p.cat][0]}</span><b>${esc(p.title)}</b><span style="font-size:13px">Tu voto: <b style="display:inline;font-family:var(--text);font-size:13px">${esc(myLabel(p))}</b></span></span></button>`; }).join("") : '<p class="muted">Aún no has votado.</p>'}</section></div>`;
  },
  login() {
    const st = view.step || "email";
    const box = (inner) => `<div style="max-width:420px;margin:10px auto;display:grid;gap:16px">${inner}</div>`;
    if (st === "email") return box(`<h1 style="font-size:44px">Entra en voppi!</h1><p class="muted" style="margin:0">Sin contraseña. Te mandamos un código de 6 cifras y en 30 segundos estás votando.</p><form class="form" id="emailForm"><label class="field">Email<input id="email" type="email" required placeholder="tu@email.com" autocomplete="email"></label><button class="btn btn-ink" style="padding:13px">Recibir código</button></form>`);
    if (st === "code") return box(`<h1 style="font-size:40px">Revisa tu email</h1><p class="muted" style="margin:0">Código enviado a <b style="color:var(--ink)">${esc(view.email)}</b>.</p><p class="note">Vista previa: no se envían emails. Tu código es <b class="mono" style="color:var(--ink)">${view.code}</b></p><form class="form" id="codeForm"><label class="field">Código<input id="code" inputmode="numeric" maxlength="6" placeholder="000000" class="mono" style="font-size:26px;letter-spacing:.3em" autocomplete="one-time-code"></label><p id="codeErr" style="color:var(--a);margin:0;font-size:13px" hidden>Código incorrecto.</p><button class="btn btn-ink" style="padding:13px">Entrar</button></form>`);
    return box(`<span class="kicker">Último paso</span><h1 style="font-size:40px">Un poco sobre ti</h1><p class="muted" style="margin:0">Para mostrar qué opina cada país, edad y género. Nunca mostramos datos individuales.</p>
      <form class="form" id="profileForm"><fieldset style="border:0;padding:0;margin:0"><legend class="field" style="margin-bottom:8px">Edad</legend><div class="chips">${["16-17", "18-24", "25-34", "35-44", "45-54", "55-64", "65+"].map((a) => `<label><input type="radio" name="age" value="${a}" required><span>${a}</span></label>`).join("")}</div></fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="field" style="margin-bottom:8px">Género</legend><div class="chips">${["Mujer", "Hombre", "No binario", "Prefiero no decirlo"].map((g) => `<label><input type="radio" name="gender" value="${g}" required><span>${g}</span></label>`).join("")}</div></fieldset>
      <label class="field">País<select id="country" required><option value="">Elige tu país</option>${["Argentina", "Chile", "Colombia", "España", "Estados Unidos", "México", "Perú", "Venezuela"].map((c) => `<option>${c}</option>`).join("")}</select></label>
      <label class="check"><input type="checkbox" required>Tengo 16 años o más y acepto las condiciones y la política de privacidad.</label><button class="btn btn-ink" style="padding:13px">Empezar a votar</button></form>`);
  },
  create() {
    if (!user) return `<div style="max-width:420px;margin:10px auto;display:grid;gap:14px"><h1 style="font-size:44px">Crea tu pregunta</h1><p class="muted" style="margin:0">Necesitas una cuenta. Si la publicamos, ganas 100 puntos.</p><button class="btn btn-ink" data-go="login" data-next="__create">Crear cuenta</button></div>`;
    return `<div style="max-width:560px;margin:0 auto;display:grid;gap:16px"><h1 style="font-size:44px">Crea tu pregunta</h1><p class="muted" style="margin:0">Dos opciones para un duelo o hasta diez para un ranking. La revisamos antes de publicarla.</p>
      <form class="form" id="createForm" style="max-width:none"><label class="field">Pregunta<input id="ctitle" required minlength="8" placeholder="¿Tortilla con o sin cebolla?"></label><div id="dupBox"></div>
      <label class="field">Categoría<select required><option value="">Elige una</option>${Object.entries(CATS).map(([k, c]) => `<option value="${k}">${c[0]}</option>`).join("")}</select></label>
      <label class="field">Opción 1<input required></label><label class="field">Opción 2<input required></label>
      <label class="check"><input type="checkbox" checked>Permitir «Otra respuesta» escrita por los votantes</label><button class="btn btn-a" style="padding:13px">Enviar a revisión</button></form></div>`;
  },
};

function segments(p) {
  const r = results(p), cur = view.seg || "pais";
  if (!user) return `<div class="callout"><span>Regístrate para ver qué ha votado cada país, edad y género.</span><button class="btn btn-ink" data-go="login" data-next="${p.id}">Crear cuenta gratis</button></div>`;
  const groups = { pais: [["España", 0.25], ["México", 0.11], ["Argentina", 0.08], ["Colombia", 0.06]], edad: [["18-24", 0.3], ["25-34", 0.28], ["35-44", 0.18], ["45-54", 0.1]], genero: [["Mujer", 0.47], ["Hombre", 0.47]] }[cur];
  let seed = p.id.length * 7 + cur.length;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const tones = ["var(--pink)", "var(--ink)", "#b9d63f", "#a8a8a0", "#7a7987", "#f2a7b7"];
  return `<div class="texttabs" role="tablist" style="margin-bottom:14px">${[["pais", "País"], ["edad", "Edad"], ["genero", "Género"]].map(([k, l]) => `<button role="tab" aria-selected="${k === cur}" data-seg="${k}">${l}</button>`).join("")}</div><div class="segs">${groups.map(([g, share]) => { const ps = pcts(r.rows.map((o) => Math.max(1, o.count * (0.75 + rnd() * 0.5)))); const w = ps.indexOf(Math.max(...ps)); return `<div class="seg"><div class="h"><b>${g}</b><span class="muted">gana ${esc(r.rows[w].label)} · <span class="mono">${fmt(Math.round(r.total * share * 0.72))}</span></span></div><div class="t">${ps.map((v, k) => `<span style="width:${v}%;background:${tones[k % tones.length]}"></span>`).join("")}</div></div>`; }).join("")}</div>`;
}

/* ---------------- Render ---------------- */
function renderHeader() {
  $("#hright").innerHTML = user
    ? `<span class="pts d">${balance()} pts</span><button class="btn btn-a d" data-go="create">Crear encuesta</button><button class="avatar" data-go="profile" aria-label="Mi perfil">${esc(user.email[0].toUpperCase())}</button>`
    : `<button class="iconbtn m" data-go="explore" aria-label="Buscar"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button class="btn d" data-go="login">Entrar</button><button class="btn btn-ink" data-go="login">Crear cuenta</button>`;
  const map = { home: "home", feed: isMobile() ? "feed" : "feed", explore: "explore", poll: "explore", rankings: "rankings", profile: "profile", login: "profile", create: "create" };
  document.querySelectorAll(".nav [data-go], .tabbar [data-go]").forEach((b) => (b.dataset.go === map[view.name] ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
  if (!isMobile()) { const h = document.querySelector('.nav [data-go="home"]'); if (view.name === "home") h.setAttribute("aria-current", "page"); }
}
function render() {
  clearTimer();
  if (view.name === "home" && isMobile()) view.name = "feed";
  const inFeed = view.name === "feed";
  if (inFeed && (!feedQueue || feedIdx >= feedQueue.length && POLLS.some((p) => !votes[p.id]))) startFeed();
  $("#app").innerHTML = pages[view.name]();
  $("#top").hidden = inFeed && isMobile();
  $("#foot").hidden = inFeed;
  $("#tabbar").classList.toggle("dark", inFeed);
  if (inFeed && !isMobile()) { const fr = $("#feedroot"); fr.style.cssText = "position:relative;inset:auto;max-width:420px;height:min(820px,calc(100vh - 140px));margin:0 auto;border-radius:12px;overflow:hidden"; }
  renderHeader();
  if (inFeed) renderFeed();
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll("#app [data-w]").forEach((el) => { if (!el.closest(".feed")) el.style.width = el.dataset.w + "%"; })));
}
function go(name, data = {}) { view = { name, ...data }; render(); window.scrollTo(0, 0); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, tr[data-poll]");
  if (!t) return;
  const d = t.dataset;
  if (d.fvote !== undefined) { const p = feedPoll(); castVote(p.id, d.fvote === "other" ? null : Number(d.fvote)); return renderFeed(); }
  if (d.fother) { clearTimer(); $("#otherslot").innerHTML = `<form class="otherin" id="fotherForm"><input id="fotherText" maxlength="60" placeholder="Tu serie, película, lo que sea…" aria-label="Escribe tu respuesta"><button class="btn btn-a">Votar</button></form>`; return $("#fotherText").focus(); }
  if (d.fnext) return nextStory();
  if (d.detail) { clearTimer(); return go("poll", { id: d.detail }); }
  if (d.vote) { castVote(d.vote, Number(d.i)); if (earnedNow) toast(`+${earnedNow} puntos`); return render(); }
  if (d.pother) { $("#otherslot").innerHTML = `<form class="otherrow" id="potherForm" data-id="${d.pother}"><input id="potherText" maxlength="60" placeholder="Escribe tu respuesta" aria-label="Escribe tu respuesta"><button class="btn btn-ink">Votar</button></form>`; return $("#potherText").focus(); }
  if (d.poll) return go("poll", { id: d.poll });
  if (d.cat !== undefined) return go("explore", { cat: d.cat, q: view.q, sort: view.sort });
  if (d.sort) { view.sort = d.sort; return render(); }
  if (d.homecat !== undefined) { view.cat = d.homecat; return render(); }
  if (d.rankcat !== undefined) return go("rankings", { t: view.t, cat: d.rankcat });
  if (d.rank) return go("rankings", { t: d.rank, cat: view.cat });
  if (d.seg) { view.seg = d.seg; return render(); }
  if (d.net) return toast(d.net === "1" ? "En la web real se descarga la imagen vertical para Stories" : "Enlace copiado");
  if (t.id === "logout") { user = null; store.set("user", null); return go("home"); }
  if (d.go) return go(d.go, d.next ? { next: d.next } : {});
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "fotherForm") { const txt = $("#fotherText").value.trim(); if (!txt) return; const p = feedPoll(); const [i, o] = resolveOther(p, txt); castVote(p.id, i, o); return renderFeed(); }
  if (f.id === "potherForm") { const txt = $("#potherText").value.trim(); if (!txt) return; const p = byId(f.dataset.id); const [i, o] = resolveOther(p, txt); castVote(p.id, i, o); return render(); }
  if (f.id === "emailForm") return go("login", { step: "code", email: $("#email").value.trim(), code: String(Math.floor(100000 + Math.random() * 900000)), next: view.next });
  if (f.id === "codeForm") { if ($("#code").value.replace(/\D/g, "") !== view.code) { $("#codeErr").hidden = false; return; } view.step = "profile"; return render(); }
  if (f.id === "profileForm") {
    user = { email: view.email, age: f.age.value, gender: f.gender.value, country: $("#country").value };
    store.set("user", user);
    earn(PTS.welcome, "Bienvenida");
    Object.keys(votes).forEach((id) => { if (pointsToday() + PTS.vote <= PTS.cap) earn(PTS.vote, "Voto: " + byId(id).title); });
    toast(`Cuenta creada · ${balance()} puntos`);
    return view.next === "__create" ? go("create") : view.next ? go("poll", { id: view.next }) : go("home");
  }
  if (f.id === "createForm") { proposals.unshift($("#ctitle").value.trim()); store.set("proposals", proposals); toast("Pregunta enviada a revisión"); return go("profile"); }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "hsearch") { go("explore", { q: e.target.value }); const i = $("#hsearch"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); return; }
  if (e.target.id === "xq") { const val = e.target.value; view.q = val; render(); const i = $("#xq"); i.focus(); i.setSelectionRange(val.length, val.length); return; }
  if (e.target.id === "ctitle") {
    const words = e.target.value.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/).filter((w) => w.length >= 4);
    const sim = words.length ? POLLS.filter((p) => { const tt = p.title.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, ""); return words.some((w) => tt.includes(w)); }).slice(0, 3) : [];
    $("#dupBox").innerHTML = sim.length ? `<p class="note"><b style="color:var(--ink)">Ya existen preguntas parecidas:</b> ${sim.map((p) => esc(p.title)).join(" · ")}</p>` : "";
  }
});

// Deslizar hacia arriba en el feed pasa a la siguiente historia.
let t0 = null;
document.addEventListener("touchstart", (e) => { t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!t0 || view.name !== "feed") return;
  const dy = e.changedTouches[0].clientY - t0.y, dx = e.changedTouches[0].clientX - t0.x;
  const p = feedPoll();
  if ((dy < -70 || dx < -70) && p && votes[p.id]) nextStory();
  t0 = null;
});

// Vista escritorio dentro del móvil: se maqueta a 1280 px y se escala.
const shell = $("#shell"), vp = $("#viewport"), modeBtn = $("#modebtn");
let desk = false, lastMobile = null;
function fit() {
  if (desk) { const k = Math.min(1, vp.clientWidth / 1280); shell.style.transform = `scale(${k})`; vp.style.height = shell.scrollHeight * k + "px"; }
  else { shell.style.transform = ""; vp.style.height = ""; }
  const m = isMobile();
  if (lastMobile !== null && m !== lastMobile) { if (view.name === "feed" && !m) view.name = "home"; render(); }
  lastMobile = m;
}
new ResizeObserver(fit).observe(shell);
modeBtn.addEventListener("click", () => {
  desk = !desk;
  shell.classList.toggle("desk", desk);
  modeBtn.textContent = desk ? "Ver móvil" : "Ver escritorio";
  modeBtn.setAttribute("aria-pressed", String(desk));
  if (desk && view.name === "feed") view.name = "home";
  fit(); render(); window.scrollTo(0, 0);
});

render();
</script>
